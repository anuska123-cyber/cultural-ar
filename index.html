<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>AR Peacock Poster</title>

  <link rel="stylesheet" href="style.css" />

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

  <div id="ar-container">
    <a-scene
      id="ar-scene"
      mindar-image="imageTargetSrc: assets/target/peacock.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no;"
      color-space="sRGB"
      renderer="colorManagement: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-light type="ambient" intensity="1"></a-light>
      <a-light type="directional" position="1 2 3" intensity="0.8"></a-light>

      <!-- Image target index 0 = the peacock poster -->
      <a-entity id="target" mindar-image-target="targetIndex: 0">

        <a-entity id="peacock" position="0 -0.25 0.05" scale="1.1 1.1 1.1">

          <!-- Gentle left/right sway of the whole bird -->
          <a-entity animation="property: rotation; from: 0 -12 0; to: 0 12 0; dur: 2600; dir: alternate; easing: easeInOutSine; loop: true">

            <!-- Tail fan: pulses slowly -->
            <a-entity position="0 0.03 -0.04"
                      animation="property: scale; from: 1 1 1; to: 1.1 1.1 1; dur: 1400; dir: alternate; easing: easeInOutSine; loop: true">

              <a-circle radius="0.14" position="0 0.02 -0.005" color="#0b6e4f"></a-circle>

              <a-entity rotation="0 0 -80"><a-box width="0.014" height="0.36" depth="0.004" position="0 0.2 0" color="#2e7d32"></a-box><a-sphere radius="0.038" position="0 0.39 0" scale="1 1.3 0.35" color="#00b8d4"></a-sphere><a-sphere radius="0.017" position="0 0.39 0.012" scale="1 1.3 0.35" color="#1a237e"></a-sphere></a-entity>
              <a-entity rotation="0 0 -60"><a-box width="0.014" height="0.40" depth="0.004" position="0 0.22 0" color="#2e7d32"></a-box><a-sphere radius="0.038" position="0 0.43 0" scale="1 1.3 0.35" color="#00b8d4"></a-sphere><a-sphere radius="0.017" position="0 0.43 0.012" scale="1 1.3 0.35" color="#1a237e"></a-sphere></a-entity>
              <a-entity rotation="0 0 -40"><a-box width="0.014" height="0.44" depth="0.004" position="0 0.24 0" color="#2e7d32"></a-box><a-sphere radius="0.038" position="0 0.47 0" scale="1 1.3 0.35" color="#00b8d4"></a-sphere><a-sphere radius="0.017" position="0 0.47 0.012" scale="1 1.3 0.35" color="#1a237e"></a-sphere></a-entity>
              <a-entity rotation="0 0 -20"><a-box width="0.014" height="0.46" depth="0.004" position="0 0.25 0" color="#2e7d32"></a-box><a-sphere radius="0.038" position="0 0.49 0" scale="1 1.3 0.35" color="#00b8d4"></a-sphere><a-sphere radius="0.017" position="0 0.49 0.012" scale="1 1.3 0.35" color="#1a237e"></a-sphere></a-entity>
              <a-entity rotation="0 0 0"><a-box width="0.014" height="0.48" depth="0.004" position="0 0.26 0" color="#2e7d32"></a-box><a-sphere radius="0.038" position="0 0.51 0" scale="1 1.3 0.35" color="#00b8d4"></a-sphere><a-sphere radius="0.017" position="0 0.51 0.012" scale="1 1.3 0.35" color="#1a237e"></a-sphere></a-entity>
              <a-entity rotation="0 0 20"><a-box width="0.014" height="0.46" depth="0.004" position="0 0.25 0" color="#2e7d32"></a-box><a-sphere radius="0.038" position="0 0.49 0" scale="1 1.3 0.35" color="#00b8d4"></a-sphere><a-sphere radius="0.017" position="0 0.49 0.012" scale="1 1.3 0.35" color="#1a237e"></a-sphere></a-entity>
              <a-entity rotation="0 0 40"><a-box width="0.014" height="0.44" depth="0.004" position="0 0.24 0" color="#2e7d32"></a-box><a-sphere radius="0.038" position="0 0.47 0" scale="1 1.3 0.35" color="#00b8d4"></a-sphere><a-sphere radius="0.017" position="0 0.47 0.012" scale="1 1.3 0.35" color="#1a237e"></a-sphere></a-entity>
              <a-entity rotation="0 0 60"><a-box width="0.014" height="0.40" depth="0.004" position="0 0.22 0" color="#2e7d32"></a-box><a-sphere radius="0.038" position="0 0.43 0" scale="1 1.3 0.35" color="#00b8d4"></a-sphere><a-sphere radius="0.017" position="0 0.43 0.012" scale="1 1.3 0.35" color="#1a237e"></a-sphere></a-entity>
              <a-entity rotation="0 0 80"><a-box width="0.014" height="0.36" depth="0.004" position="0 0.2 0" color="#2e7d32"></a-box><a-sphere radius="0.038" position="0 0.39 0" scale="1 1.3 0.35" color="#00b8d4"></a-sphere><a-sphere radius="0.017" position="0 0.39 0.012" scale="1 1.3 0.35" color="#1a237e"></a-sphere></a-entity>
            </a-entity>

            <!-- Body -->
            <a-sphere radius="0.1" position="0 0 0" scale="0.8 1 1.3" color="#1565c0"></a-sphere>

            <!-- Legs -->
            <a-cylinder radius="0.007" height="0.14" position="-0.035 -0.15 0.02" color="#8d6e63"></a-cylinder>
            <a-cylinder radius="0.007" height="0.14" position="0.035 -0.15 0.02" color="#8d6e63"></a-cylinder>

            <!-- Neck -->
            <a-cylinder radius="0.03" height="0.26" position="0 0.17 0.08" rotation="15 0 0" color="#1976d2"></a-cylinder>

            <!-- Head: bobs up and down -->
            <a-entity position="0 0.31 0.11"
                      animation="property: rotation; from: -8 0 0; to: 12 0 0; dur: 1100; dir: alternate; easing: easeInOutSine; loop: true">
              <a-sphere radius="0.05" color="#0d47a1"></a-sphere>
              <a-cone radius-bottom="0.015" radius-top="0" height="0.05" position="0 -0.005 0.06" rotation="90 0 0" color="#ffb300"></a-cone>
              <a-sphere radius="0.008" position="-0.025 0.015 0.04" color="#ffffff"></a-sphere>
              <a-sphere radius="0.008" position="0.025 0.015 0.04" color="#ffffff"></a-sphere>
              <a-cylinder radius="0.003" height="0.07" position="0 0.07 0" color="#2e7d32"></a-cylinder>
              <a-sphere radius="0.012" position="0 0.11 0" color="#00b8d4"></a-sphere>
            </a-entity>
          </a-entity>
        </a-entity>

      </a-entity>
    </a-scene>
  </div>

  <div id="start-screen" class="overlay">
    <div class="card">
      <h1>Meet the Peacock</h1>
      <p id="intro-msg">Tap the button, allow camera access, then point your phone at the printed poster.</p>
      <button id="start-btn" type="button">Start AR</button>
      <p id="error-msg" class="error" hidden></p>
    </div>
  </div>

  <div id="status" class="status" role="status" aria-live="polite" hidden>Looking for poster...</div>
  <button id="exit-btn" class="exit-btn" type="button" hidden>Exit AR</button>

  <script src="app.js"></script>
</body>
</html>
