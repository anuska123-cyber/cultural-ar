<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>AR Peacock Poster</title>

  <link rel="stylesheet" href="style.css" />

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

  <div id="ar-container">
    <a-scene
      id="ar-scene"
      mindar-image="imageTargetSrc: assets/target/peacock.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no;"
      color-space="sRGB"
      renderer="colorManagement: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <img id="peacockImg" src="assets/images/peacock-cutout.png" />
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Image target index 0 = the peacock poster -->
      <a-entity id="target" mindar-image-target="targetIndex: 0">

        <a-entity id="peacock">

          <!-- Cutout floating above the poster, gently bobbing and swaying -->
          <a-entity position="0 0 0.12"
                    animation__float="property: position; from: 0 0 0.12; to: 0 0.03 0.22; dur: 1800; dir: alternate; easing: easeInOutSine; loop: true"
                    animation__sway="property: rotation; from: 0 -6 0; to: 0 6 0; dur: 2800; dir: alternate; easing: easeInOutSine; loop: true">

            <!-- 825 x 1024 poster: width 1, height 1024/825 = 1.241 -->
            <a-plane width="1" height="1.241"
                     material="shader: flat; src: #peacockImg; transparent: true; alphaTest: 0.05; side: double"></a-plane>
          </a-entity>

        </a-entity>

      </a-entity>
    </a-scene>
  </div>

  <div id="start-screen" class="overlay">
    <div class="card">
      <h1>Meet the Peacock</h1>
      <p id="intro-msg">Tap the button, allow camera access, then point your phone at the printed poster.</p>
      <button id="start-btn" type="button">Start AR</button>
      <p id="error-msg" class="error" hidden></p>
    </div>
  </div>

  <div id="status" class="status" role="status" aria-live="polite" hidden>Looking for poster...</div>
  <button id="exit-btn" class="exit-btn" type="button" hidden>Exit AR</button>

  <script src="app.js"></script>
</body>
</html>
